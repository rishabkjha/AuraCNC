<svg xmlns="http://www.w3.org/2000/svg" width="760" height="840" viewBox="0 0 760 840" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>AuraCNC pipeline flow</title>
  <desc>Phone AR capture to Firebase to Arduino UNO Q, where FastSAM-s segmentation, contour or skeleton extraction, MST and DFS path tracing, scaling to millimetres and G-code generation run, ending at the CNC machine.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="840" fill="#FFFFFF"/>

  <rect x="230" y="20" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Android app (ARCore)</text>
  <text x="380" y="60" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Capture, depth, mm-per-pixel scale</text>
  <line x1="380" y1="76" x2="380" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="108" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Firebase Realtime Database</text>
  <text x="380" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Metadata + base64 JPEG</text>
  <line x1="380" y1="164" x2="380" y2="204" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="208" width="640" height="496" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="84" y="232" font-size="14" font-weight="600" fill="#2C2C2A">Arduino UNO Q (Qualcomm Dragonwing)</text>

  <rect x="230" y="252" width="300" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="270" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Listener</text>
  <text x="380" y="287" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">New DB node, decode image</text>
  <line x1="380" y1="300" x2="380" y2="324" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="328" width="300" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="380" y="346" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">FastSAM-s segmentation</text>
  <text x="380" y="363" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Image to object mask</text>

  <path d="M380 376 V392 H235 V412" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M380 376 V392 H525 V412" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="100" y="416" width="270" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="235" y="434" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Contour extraction</text>
  <text x="235" y="451" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">3D objects, clean mask</text>

  <rect x="390" y="416" width="270" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="525" y="434" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Skeleton extraction</text>
  <text x="525" y="451" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Flat drawings, ink strokes</text>

  <path d="M235 464 V480 H380 V500" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M525 464 V480 H380" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>

  <rect x="230" y="504" width="300" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="380" y="522" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">MST + DFS path tracing</text>
  <text x="380" y="539" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Ordered, connected strokes</text>
  <line x1="380" y1="552" x2="380" y2="576" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="580" width="300" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="380" y="598" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Scale to mm + SVG</text>
  <text x="380" y="615" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">ARCore scale applied</text>
  <line x1="380" y1="628" x2="380" y2="652" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="656" width="300" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="380" y="674" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">G-code generator</text>
  <text x="380" y="691" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">SVG to toolpath commands</text>
  <line x1="380" y1="704" x2="380" y2="732" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="736" width="300" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="754" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">CNC / laser machine</text>
  <text x="380" y="771" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Cuts the scanned design</text>

  <rect x="230" y="804" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="252" y="811" dominant-baseline="central" font-size="12" fill="#5F5E5A">Design extraction pipeline</text>
  <rect x="420" y="804" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="442" y="811" dominant-baseline="central" font-size="12" fill="#5F5E5A">Capture, transport, hardware</text>
</svg>
